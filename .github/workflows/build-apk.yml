name: build-apk

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install contrib build deps (gettext/autopoint)
        run: sudo apt-get update && sudo apt-get install -y autopoint gettext autoconf automake libtool nasm yasm swig pkg-config meson ninja-build
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK & CMake (upstream dockerfile recipe)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for u in commandlinetools-linux-13114758_latest.zip commandlinetools-linux-11076708_latest.zip; do
            echo "trying $u"
            curl -sSfL -o /tmp/clt.zip "https://dl.google.com/android/repository/$u" && break
          done
          mkdir -p "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          PKGS="ndk;30.0.16248370 cmake;4.1.2 build-tools;37.0.0"
          for P in "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2"; do
            echo "== trying $P"
            "$SDKM" --channel=1 --no_https --install "$P" $PKGS && break
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prefetch restinio tarball (release 504 guard)
        env:
          GHT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd daemon/contrib
          mkdir -p tarballs
          SHA=$(awk '/restinio-0.7.9.tar.bz2/{print $1}' src/restinio/SHA512SUMS)
          echo "expect sha512: $SHA"
          ok=0
          for i in 1 2 3; do
            curl -fsSL --retry 3 --retry-delay 10 -o tarballs/restinio-0.7.9.tar.bz2 \
              "https://github.com/Stiffstream/restinio/releases/download/v0.7.9/restinio-0.7.9.tar.bz2" && ok=1 && break
            echo "primary attempt $i failed"; sleep 15
          done
          if [ "$ok" != "1" ] || ! echo "$SHA  tarballs/restinio-0.7.9.tar.bz2" | sha512sum -c --status; then
            echo "== fallback to api.github.com asset =="
            AID=$(curl -fsSL -H "Authorization: token $GHT" https://api.github.com/repos/Stiffstream/restinio/releases/tags/v0.7.9 | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['id'] for a in d['assets'] if a['name']=='restinio-0.7.9.tar.bz2'][0])")
            echo "asset id: $AID"
            curl -fsSL --retry 5 --retry-delay 10 -H "Authorization: token $GHT" -H "Accept: application/octet-stream" \
              -o tarballs/restinio-0.7.9.tar.bz2 "https://api.github.com/repos/Stiffstream/restinio/releases/assets/$AID"
          fi
          echo "$SHA  tarballs/restinio-0.7.9.tar.bz2" | sha512sum -c -
          ls -l tarballs/

      - name: Build debug APK (arm64-v8a, noPush)
        run: |
          cd jami-android
          chmod +x gradlew
          ok=0
          for url in "https://downloads.gradle.org/distributions/gradle-9.7.0-bin.zip" "https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip"; do
            echo "== trying $url"
            curl -fL --connect-timeout 20 --max-time 420 --retry 3 -o /tmp/gradle.zip "$url" && ok=1 && break
          done
          [ "$ok" -eq 1 ] || { echo "all gradle dist mirrors failed"; exit 9; }
          mkdir -p /opt/gradle-dist
          unzip -qo /tmp/gradle.zip -d /opt/gradle-dist
          export PATH="/opt/gradle-dist/gradle-9.7.0/bin:$PATH"
          gradle --version | head -5
          out=/tmp/build.log
          for i in 1 2 3; do
            gradle -Partchs=arm64-v8a --no-daemon assembleNoPushDebug --stacktrace 2>&1 | tee $out
            code=${PIPESTATUS[0]}
            [ "$code" -eq 0 ] && exit 0
            grep -qE "failed: timeout|Could not download" $out || { exit $code; }
            echo "== download flake, retry $i =="; sleep 30
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jami-autoloc-debug
          path: jami-android/app/build/outputs/apk/noPush/debug/*.apk
          if-no-files-found: error
