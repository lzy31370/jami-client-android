name: build-apk

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK & CMake
        run: sdkmanager --install "ndk;30.0.16248370" "cmake;4.1.2"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (arm64-v8a, noPush)
        run: |
          cd jami-android
          ./gradlew -Partchs=arm64-v8a assembleNoPushDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jami-autoloc-debug
          path: jami-android/app/build/outputs/apk/noPush/debug/*.apk
          if-no-files-found: error
