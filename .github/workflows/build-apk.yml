name: build-apk

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK & CMake
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for u in commandlinetools-linux-13423397_latest.zip commandlinetools-linux-13114758_latest.zip commandlinetools-linux-11076708_latest.zip; do
            echo "trying $u"
            curl -sSfL -o /tmp/clt.zip "https://dl.google.com/android/repository/$u" && break
          done
          mkdir -p "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          PKGS="ndk;30.0.16248370 cmake;4.1.2 platforms;android-37 build-tools;37.0.0"
          "$SDKM" --install $PKGS || "$SDKM" --channel=3 --install $PKGS

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (arm64-v8a, noPush)
        run: |
          cd jami-android
          chmod +x gradlew
          ./gradlew -Partchs=arm64-v8a --no-daemon assembleNoPushDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jami-autoloc-debug
          path: jami-android/app/build/outputs/apk/noPush/debug/*.apk
          if-no-files-found: error
